name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ 2.7, 3.0, 3.1, 3.2, 3.3, 3.4, 4.0 ]
    env:
      BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install RBS collection
        run: bundle exec rbs collection install 2>/dev/null || echo "rbs collection install skipped (not available)"

      - name: Docscribe (check docs are up-to-date)
        run: bundle exec docscribe --rbs-collection lib/ 2>/dev/null || bundle exec docscribe lib/

      - name: RuboCop (self‑check)
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec
